services:
  db:
    # postgis/postgis собирается только под amd64; imresamu — multi-arch сборка
    # тех же образов, нужна для Apple Silicon без эмуляции.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_DB: findme
      POSTGRES_USER: findme
      POSTGRES_PASSWORD: findme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgis://findme:findme@db:5432/findme
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgis://findme:findme@db:5432/findme
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgis://findme:findme@db:5432/findme
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgis://findme:findme@db:5432/findme
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    profiles: ["bot"]

volumes:
  pgdata:
  redisdata:
