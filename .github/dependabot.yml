version: 2

updates:
  # Экшены в CI: пины на major-теги протухают тихо.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels: ["chore"]
    open-pull-requests-limit: 3

  # Питон-зависимости через uv.lock. Границу `<5.3` в pyproject Dependabot
  # готов подвинуть сам, поэтому major/minor Django запрещены явно:
  # LTS-линия меняется осознанно, отдельным PR (AGENTS.md, «Python / Django»).
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore"]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: django
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      dev-tools:
        patterns: ["ruff", "pytest*", "factory-boy", "django-debug-toolbar", "django-extensions", "ipython"]
      runtime:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pytest*", "factory-boy", "django-debug-toolbar", "django-extensions", "ipython"]
