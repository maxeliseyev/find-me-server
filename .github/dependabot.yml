version: 2

updates:
  # Экшены в CI: пины на major-теги протухают тихо.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels: ["chore"]
    open-pull-requests-limit: 3

  # Питон-зависимости через uv.lock. Django ограничен `<5.3` в pyproject:
  # LTS-линия меняется отдельным PR, а не автоматическим бампом.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore"]
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["ruff", "pytest*", "factory-boy", "django-debug-toolbar", "django-extensions", "ipython"]
      runtime:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pytest*", "factory-boy", "django-debug-toolbar", "django-extensions", "ipython"]
